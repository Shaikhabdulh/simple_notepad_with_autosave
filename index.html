<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Notepad</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Minimal Header -->
  <header class="app-header">
    <div class="app-title">Minimal Notepad</div>
    <div class="header-controls">
      <button class="icon-btn" id="menuBtn" aria-label="Menu" title="Menu">⋮</button>
      <button class="icon-btn close-btn" id="closeBtn" aria-label="Close" title="Close (Ctrl+W)">×</button>
    </div>
  </header>

  <!-- Menu Dropdown -->
  <nav class="menu-dropdown" id="menuDropdown">
    <button class="menu-item" data-action="new">
      <span class="menu-icon">📄</span>
      <span>New Tab</span>
    </button>
    <button class="menu-item" data-action="open">
      <span class="menu-icon">📂</span>
      <span>Open File</span>
    </button>
    <button class="menu-item" data-action="save">
      <span class="menu-icon">💾</span>
      <span>Save</span>
    </button>
    <button class="menu-item" data-action="download">
      <span class="menu-icon">⬇️</span>
      <span>Download</span>
    </button>
    <div class="menu-divider"></div>
    <button class="menu-item" data-action="spell-check">
      <span class="menu-icon">✓</span>
      <span id="spellCheckLabel">Enable Spell Check</span>
    </button>
    <div class="menu-section">
      <label class="menu-label">Font</label>
      <select class="menu-select" id="fontSelect">
        <option value="'Courier New', monospace">Courier New</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="Verdana, sans-serif">Verdana</option>
        <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
        <option value="monospace">Monospace</option>
      </select>
    </div>
    <div class="menu-section">
      <label class="menu-label">Zoom</label>
      <div class="zoom-controls">
        <button class="zoom-btn" data-action="zoom-out">−</button>
        <span class="zoom-display" id="zoomDisplay">100%</span>
        <button class="zoom-btn" data-action="zoom-in">+</button>
        <button class="zoom-btn" data-action="zoom-reset">⊡</button>
      </div>
    </div>
  </nav>

  <!-- Tabs Container -->
  <div class="tabs-bar" id="tabsBar"></div>

  <!-- Editor Area -->
  <main class="editor-wrapper" id="editorWrapper">
    <textarea 
      class="editor-textarea" 
      id="editorTextarea" 
      placeholder="Start typing..."
      spellcheck="false"
    ></textarea>
  </main>

  <!-- Floating Status Bar -->
  <footer class="status-bar">
    <span class="status-pill">
      <span class="status-text" id="statusText">Ready</span>
    </span>
    <span class="status-pill">
      <span class="status-info" id="statusInfo">0 words, 0 chars</span>
    </span>
  </footer>

  <!-- Spell Check Panel -->
  <div class="spell-panel" id="spellPanel">
    <div class="spell-content" id="spellContent"></div>
  </div>

  <!-- JavaScript Files -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/spell-checker.js"></script>
  <script src="js/zoom.js"></script>
  <script src="js/file-handler.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
